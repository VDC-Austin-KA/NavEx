name: Build NavEx

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Type-checks every source file (code-behind included) against each supported
  # Navisworks year. This is what actually enforces the claim on the tin: if a
  # member NavEx calls is missing or changed its signature in any one year, that
  # year's leg fails while the others stay green.
  #
  # Runs on Linux because it needs neither Windows nor Navisworks, so it still
  # reports when Windows runners are unavailable — which is exactly when a
  # compile check matters most.
  typecheck:
    name: Type check ${{ matrix.year }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2024"
            package: "2024.0.0"
          - year: "2025"
            package: "2025.0.0"
          - year: "2026"
            package: "2026.0.1"
          - year: "2027"
            package: "2027.0.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate the XAML codegen stand-in
        run: python3 tools/typecheck/gen_xaml_stub.py

      - name: Type check against the Navisworks ${{ matrix.year }} API
        run: >
          dotnet build tools/typecheck/typecheck.csproj
          -p:NWPackageVersion=${{ matrix.package }}
          -warnaserror -v minimal

  # The format writers and the whole 4D layer — sequencing, name classification,
  # schedule parsing, task matching — never touch Navisworks, so they are
  # version-independent and only need checking once.
  writer-tests:
    name: Writer and 4D tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and run the writer tests
        run: |
          mkdir -p artifacts
          dotnet build tools/writer-tests/WriterTests.csproj -v minimal -o artifacts/bin
          cd artifacts && dotnet exec bin/WriterTests.dll

      - name: Validate the exported files
        run: python3 tools/writer-tests/validate_gltf.py artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: |
            artifacts/out.glb
            artifacts/out.gltf
            artifacts/out.bin
            artifacts/out.obj
            artifacts/out.mtl

  build:
    name: Navisworks ${{ matrix.year }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2024"
            package: "2024.0.0"
          - year: "2025"
            package: "2025.0.0"
          - year: "2026"
            package: "2026.0.1"
          - year: "2027"
            package: "2027.0.0"

    steps:
      - uses: actions/checkout@v4

      # WPF on .NET Framework needs full MSBuild — `dotnet build` cannot compile
      # XAML for net48, so the SDK-style project is driven by MSBuild here.
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild NavEx\NavEx.CI.csproj
          -t:restore
          -p:Configuration=Release
          -p:Platform=x64
          -p:NWYear=${{ matrix.year }}
          -p:NWPackageVersion=${{ matrix.package }}

      - name: Build
        run: >
          msbuild NavEx\NavEx.CI.csproj
          -t:build
          -p:Configuration=Release
          -p:Platform=x64
          -p:NWYear=${{ matrix.year }}
          -p:NWPackageVersion=${{ matrix.package }}
          -warnaserror:CS0618
          -v:minimal

      - name: Stage plugin files
        shell: pwsh
        run: |
          $out = "staging/V$($env:YEAR.Substring(2))"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "NavEx/bin/x64/Release/net48/NavEx.dll" $out
          Copy-Item "NavEx/NavEx.addin" $out
        env:
          YEAR: ${{ matrix.year }}

      - uses: actions/upload-artifact@v4
        with:
          name: NavEx-NW${{ matrix.year }}
          path: staging/

  package:
    name: Package plugin zip
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble NavEx-Plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path NavEx-Plugin | Out-Null
          Get-ChildItem artifacts -Directory | ForEach-Object {
            Copy-Item "$($_.FullName)/*" NavEx-Plugin -Recurse -Force
          }
          Copy-Item installer/Install.cmd   NavEx-Plugin
          Copy-Item installer/Uninstall.cmd NavEx-Plugin
          Copy-Item installer/README.txt    NavEx-Plugin
          Compress-Archive -Path NavEx-Plugin/* -DestinationPath NavEx-Plugin.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NavEx-Plugin
          path: NavEx-Plugin.zip
